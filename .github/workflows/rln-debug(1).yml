name: RLN Network - APK di prova

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Compila RLN Network Debug
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Configura Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configura Android SDK
        uses: android-actions/setup-android@v4

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Conserva la chiave di firma Debug
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: rln-network-debug-keystore-v1

      - name: Crea la chiave Debug se assente
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=RLN Network Debug,O=RLN Network,C=IT" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Compila APK FOSS Debug
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain :app:assembleFossDebug -x lint

      - name: Pubblica APK da scaricare
        uses: actions/upload-artifact@v4
        with:
          name: RLN-Network-debug
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
